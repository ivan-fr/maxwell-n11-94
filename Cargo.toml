[package]
name = "maxwell-n11-94"
version = "0.1.0"
edition = "2024"
authors = ["Ivan Besevic <ivan.besevic@edu.esiee-it.fr>"]
license = "MIT"
description = "Certified proof of M+(11) >= 94 (and M+(2k+1) >= 20k - 6 for all k >= 5) for Maxwell's electrostatic conjecture using pandsysroots 0.34.0 and Pandrosion V31 projective radical enclosures"

[dependencies]
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
pandsysroots = "0.34.0"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
